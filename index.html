<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viktor Bozzay — CV</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff7024'/><text x='50' y='68' font-size='40' font-weight='800' font-family='monospace' fill='white' text-anchor='middle'>&amp;lt;/&amp;gt;</text></svg>"
    />
    <link rel="stylesheet" href="./styles/cv-index.css" />
    <link rel="stylesheet" href="./styles/lang-dropdown.css" />
    <link rel="stylesheet" href="./styles/cv-music-player.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <button id="theme-toggle" aria-label="Toggle theme">☀️</button>
    <div class="card">
      <h2 data-i18n="cvOf">Curriculum Vitae of</h2>
      <h1>Viktor Bozzay <small data-i18n="roleLocation">Frontend Tech Lead &middot; Pécs, HU</small></h1>
      <div class="divider"></div>
      <p class="subtitle" data-i18n="chooseView">Choose how to view my CV</p>
      <div class="btns">
        <a class="btn" href="cv-plain.html"
          ><span class="label" data-i18n="btnReadingLabel">I'm reading CV</span
          ><span class="desc" data-i18n="btnReadingDesc">Clean, readable, printable CV</span></a
        ><a class="btn" href="cv-swagger.html"
          ><span class="label" data-i18n="btnFrontendLabel">I'm a Frontend Developer</span
          ><span class="desc" data-i18n="btnFrontendDesc">Swagger-style API docs</span></a
        ><a class="btn" href="cv-json.html"
          ><span class="label" data-i18n="btnBackendLabel">I'm a Backend Developer</span
          ><span class="desc" data-i18n="btnBackendDesc">JSON / VS Code view</span></a
        ><a class="btn btn-game" href="cv-game.html"
          ><span class="label" data-i18n="btnGamerLabel">I'm a Gamer</span
          ><span class="desc" data-i18n="btnGamerDesc">Interactive 2.5D RPG world</span></a
        >
      </div>
      <div class="btns margin-top">
        <button class="btn btn-hire" id="hire-index-btn">
          <span class="label" data-i18n="btnHireLabel">Hire Me</span
          ><span class="desc" data-i18n="btnHireDesc">Send me a message</span>
        </button>
        <button class="btn btn-book" id="index-booking-btn">
          <span class="label"><i class="fa-regular fa-calendar-check"></i> <span data-i18n="bookMeeting">Book a Meeting</span></span
          ><span class="desc" data-i18n="bookMeetingDesc">Schedule a call with me</span>
        </button>
      </div>
      <div class="footer">
        <a href="mailto:bozzay.viktor@gmail.com">bozzay.viktor@gmail.com</a>
      </div>
    </div>
    <div id="cv-toaster-container"></div>
    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./scripts/cv-index.js"></script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  </body>
</html>
