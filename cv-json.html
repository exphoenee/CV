<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viktor_bozzay.json</title>
    <link rel="icon" href="assets/vscode.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/cv-json.css" />
  </head>
  <body>
    <div class="menubar">
      <div class="menubar-left">
        <img src="assets/vscode.svg" width="16" height="16" style="margin:0 6px 0 8px;flex-shrink:0;align-self:center;opacity:0.9" alt="VSCode">
        <button class="menubar-item">File</button>
        <button class="menubar-item">Edit</button>
        <button class="menubar-item">Selection</button>
        <button class="menubar-item">View</button>
        <button class="menubar-item">Go</button>
        <button class="menubar-item">Run</button>
        <button class="menubar-item">Terminal</button>
        <button class="menubar-item" id="hire-json-btn" style="font-weight:700;color:#f48771">Hire</button>
      </div>
      <div class="menubar-center">
        <button class="menubar-nav" disabled aria-label="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="10,4 6,8 10,12"/>
          </svg>
        </button>
        <button class="menubar-nav" aria-label="Forward">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6,4 10,8 6,12"/>
          </svg>
        </button>
        <div class="menubar-crumb">
          <span class="menubar-crumb-dot">●</span>
          <span class="menubar-crumb-folder">CV</span>
          <span class="menubar-crumb-sep">›</span>
          <span class="menubar-crumb-file">
            <span class="tab-json" style="font-size:11px">{ }</span>
            viktor_bozzay.json
          </span>
        </div>
      </div>
      <div class="menubar-right">
        <div class="menubar-scm">
          <span class="menubar-scm-dot">●</span>
          <span>10</span>
        </div>
        <div class="menubar-layout-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" opacity="0.8">
            <rect x="1" y="1" width="6" height="14" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>
          </svg>
        </div>
        <span class="menubar-chevron">∨</span>
        <button class="wc-btn" title="Minimize">
          <svg width="11" height="1" viewBox="0 0 11 1" fill="currentColor"><rect width="11" height="1"/></svg>
        </button>
        <button class="wc-btn" title="Restore Down">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x=".5" y=".5" width="9" height="9"/></svg>
        </button>
        <button class="wc-btn wc-close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <line x1="0" y1="0" x2="10" y2="10"/><line x1="10" y1="0" x2="0" y2="10"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="titlebar">
      <div class="tab">
        <span class="tab-json">{ }</span>
        viktor_bozzay.json
      </div>
    </div>

    <div class="editor">
      <div class="gutter" id="G"></div>
      <div class="code" id="C"></div>
    </div>

    <div class="statusbar">
      <span>JSON</span><span>UTF-8</span>
      <span>Ln <span id="ln">1</span></span>
      <span class="r"
        >Frontend Tech Lead &nbsp;·&nbsp; Pécs, HU &nbsp;·&nbsp; bozzay.viktor@gmail.com</span
      >
    </div>

    <script src="./scripts/cv-json.js"></script>

<!-- HIRE MODAL -->
<div id="hire-json-modal" style="display:none">
  <div class="hire-backdrop" id="hire-json-backdrop"></div>
  <div class="hire-dialog">
    <div class="hire-dialog-header">
      <h3>Contact Viktor</h3>
      <button class="hire-close" id="hire-json-close" type="button">&#x2715;</button>
    </div>
    <div data-fs-success style="display:none;padding:40px 20px;text-align:center">
      <p style="color:#49cc90;font-weight:700;font-size:15px;margin:0 0 4px">Thanks for reaching out!</p>
      <p style="color:#cccccc;font-size:13px;margin:0">Your message was sent successfully. I'll get back to you soon.</p>
    </div>
    <div data-fs-error style="display:none;padding:8px 20px 0;color:#f48771;font-size:12px"></div>
    <form id="hire-json-form">
      <input type="hidden" name="_subject" value="Hire inquiry from CV - json">
      <div class="hire-field">
        <label for="hire-json-name">Your name</label>
        <input id="hire-json-name" type="text" name="name" required placeholder="Jane Smith" data-fs-field>
        <span data-fs-error="name" style="color:#f48771;font-size:11px"></span>
      </div>
      <div class="hire-field">
        <label for="hire-json-email">Your email</label>
        <input id="hire-json-email" type="email" name="email" required placeholder="your@email.com" data-fs-field>
        <span data-fs-error="email" style="color:#f48771;font-size:11px"></span>
      </div>
      <div class="hire-field">
        <label for="hire-json-message">Message</label>
        <textarea id="hire-json-message" name="message" required rows="5" placeholder="Hi Viktor, we'd like to..." data-fs-field></textarea>
        <span data-fs-error="message" style="color:#f48771;font-size:11px"></span>
      </div>
      <button type="submit" class="hire-submit" data-fs-submit-btn>Send</button>
    </form>
  </div>
</div>


<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  </body>
</html>
