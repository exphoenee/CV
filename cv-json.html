        color: #cccccc;

        flex-shrink: 0;
        padding-left: 4px;
      }
      .menubar-item {
        padding: 0 8px;
        display: flex;
        align-items: center;
        background: none;
        border: none;
        color: #cccccc;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        cursor: default;
        white-space: nowrap;
        border-radius: 4px;
        margin: 4px 1px;
        line-height: 1;

      .menubar-center {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0 8px;
        min-width: 0;

        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;

        border: none;
        color: #858585;
        cursor: pointer;
        border-radius: 4px;
        padding: 0;
        flex-shrink: 0;
      }
      .menubar-nav:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        color: #cccccc;
      }
      .menubar-nav:disabled {
        opacity: 0.35;
        cursor: default;
      }

        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #cccccc;
        white-space: nowrap;
        overflow: hidden;

        color: #e8c76b;
        font-size: 8px;
        line-height: 1;
      }
      .menubar-crumb-sep {

        font-size: 15px;
        line-height: 1;

        align-items: stretch;

        background: none;
        border: none;
        color: #cccccc;
        cursor: pointer;

      .gutter {

        background: var(--bg);
        padding: 8px 0 80px;
        border-right: 1px solid #2d2d2d;
      }

        line-height: 19px;
        text-align: right;
        padding-right: 12px;
        font-size: 12px;
        color: var(--lnum);
        user-select: none;
      }

      /* code area */
      .code {
        flex: 1;
        overflow-x: auto;
        padding: 8px 40px 80px 0;
      }

      /* single line */
      .l {
        display: flex;
        align-items: baseline;
        min-height: 19px;
        white-space: pre;
      }
      .l:hover {
        background: var(--hover);
      }

      /* indent cell — each level = 16px, with guide line at centre */
      .i {
        display: inline-block;
        width: 16px;
        min-width: 16px;
        height: 19px;
        position: relative;
        flex-shrink: 0;
      }
      .i::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--guide);
      }

      /* text span wraps content — allow wrap for very long strings */
      .t {
        white-space: pre-wrap;
        word-break: break-word;
        min-width: 0;
      }

        color: var(--key);

        }

          background: none;
        }

          gutterLines[i].style.height = line.offsetHeight + "px";
        });
      }

      syncGutterHeights();
      new ResizeObserver(syncGutterHeights).observe(C);

      // sync line hover between gutter and code
      C.addEventListener("mousemove", (e) => {
        const row = e.target.closest(".l");
        if (row) lnEl.textContent = row.dataset.n;
      });
    </script>
  </body>
</html>
