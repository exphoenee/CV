<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viktor Bozzay — Career Board</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23ff7024'/><rect x='16' y='18' width='22' height='64' rx='5' fill='white' opacity='.92'/><rect x='46' y='18' width='22' height='46' rx='5' fill='white' opacity='.92'/><rect x='16' y='70' width='52' height='12' rx='4' fill='white' opacity='.4'/></svg>"
    />
    <link rel="stylesheet" href="./styles/cv-index.css" />
    <link rel="stylesheet" href="./styles/cv-scrumboard.css" />
    <link rel="stylesheet" href="./styles/lang-dropdown.css" />
    <link rel="stylesheet" href="./styles/cv-music-player.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="loading-overlay" role="status" aria-label="Loading">
      <div class="loading-spinner"></div>
    </div>

    <div id="board-root"></div>
    <div id="cv-toaster-container"></div>
    <script>/* fallback: if module load fails, show error on blur cover */
(function(){var o=document.getElementById('loading-overlay');if(!o)return;var d=false;function e(){if(d||o.classList.contains('loaded'))return;d=true;var s=o.querySelector('.loading-spinner');if(s)s.style.display='none';var m=document.createElement('div');m.style.cssText='color:#ff7024;font-size:18px;font-weight:600;font-family:system-ui,sans-serif;text-align:center;padding:20px;';m.textContent='Something went wrong';o.appendChild(m)}window.addEventListener('error',function(n){if(n.target&&n.target.tagName==='SCRIPT')e()},true);window.onerror=function(){e()}})();</script>
    <script type="module" src="./scripts/cv-scrumboard.js"></script>
  </body>
</html>
